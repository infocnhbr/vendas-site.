<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recomeçar">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="application-name" content="Recomeçar">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10251f">
<title>Acesso não válido</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0c1714;color:#f2f7f3;font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;padding:24px;text-align:center}
.c{width:100%;max-width:420px;background:#14251f;border:1px solid #294238;border-radius:22px;padding:34px 28px}
.i{font-size:46px}h1{font-size:24px;margin:10px 0}p{color:#a9bcb1;margin:0 0 20px}
input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #294238;background:#0d1b16;color:#f2f7f3;margin-bottom:10px;text-align:center;font-size:16px}
button{width:100%;border:0;background:#8de0ad;color:#10251b;font-weight:800;border-radius:12px;padding:12px 18px;font-size:16px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
a{display:inline-block;color:#a9bcb1;font-size:13px;margin-top:14px;text-decoration:underline}
#e{color:#ff9e9e;font-size:13px;min-height:20px;margin-top:10px}
</style>
</head>
<body>
<div class="c">
  <div class="i">🔒</div>
  <h1>Acesso não válido</h1>
  <p>Para usar o Recomeço, entre com o CPF cadastrado.</p>
  <input id="cpf" type="text" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" autocomplete="off">
  <button id="go">Entrar com CPF</button>
  <div id="e"></div>
  <a href="/acesso.html">Primeiro acesso? Faça o cadastro</a>
</div>
<script>
var $=function(i){return document.getElementById(i)};
function mascara(v){var c=(v||"").replace(/\D/g,"").slice(0,11);
  return c.replace(/^(\d{3})(\d)/,"$1.$2").replace(/^(\d{3})\.(\d{3})(\d)/,"$1.$2.$3").replace(/\.(\d{3})(\d)/,".$1-$2");}
$("cpf").addEventListener("input",function(){this.value=mascara(this.value)});
function devId(){try{return localStorage.getItem("rc_device_id")||""}catch(e){return ""}}
function entrar(){
  var btn=$("go");btn.disabled=true;$("e").textContent="";
  fetch("/api/entrar",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({cpf:$("cpf").value,deviceId:devId()}),credentials:"same-origin"})
    .then(function(r){return r.json().then(function(j){return{status:r.status,dados:j}})})
    .then(function(r){
      if(r.status===200){location.reload();return;}
      btn.disabled=false;$("e").textContent=r.dados.erro||"Não foi possível entrar.";
    })
    .catch(function(){btn.disabled=false;$("e").textContent="Falha de conexão com o servidor.";});
}
$("go").onclick=entrar;
$("cpf").addEventListener("keydown",function(e){if(e.key==="Enter")entrar()});
$("cpf").focus();
</script>
</body>
</html>
