name = "recomeco"
main = "src/index.js"
compatibility_date = "2026-11-01"

# O HTML do app vai DENTRO do Worker (nunca como arquivo público).
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[[kv_namespaces]]
binding = "KV"
id = "COLE_AQUI_O_ID_DO_KV"   # gerado por: npx wrangler kv namespace create KV

[vars]
PRICE_CENTS = "2990"          # preço em centavos (R$ 29,90)
PRODUCT_NAME = "Recomeço - Acesso vitalício"
MAX_DEVICES = "2"             # aparelhos simultâneos por compra
# Segredos (NÃO coloque aqui): ABACATE_API_KEY e WEBHOOK_SECRET
# -> npx wrangler secret put ABACATE_API_KEY
# -> npx wrangler secret put WEBHOOK_SECRET
# Em testes (chave dev do AbacatePay), adicione: ALLOW_DEV = "1"
