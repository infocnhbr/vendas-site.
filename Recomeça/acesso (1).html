<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10251f">
<title>Validando acesso…</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 15% 0%,#1c3a2e 0,transparent 40%),#0c1714;color:#f2f7f3;font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;padding:24px;text-align:center}
.c{width:100%;max-width:400px;background:linear-gradient(145deg,#1a3028,#12221d);border:1px solid #294238;border-radius:22px;padding:34px 28px;box-shadow:0 18px 50px #0003}
.logo{width:52px;height:52px;margin:0 auto 14px;border-radius:16px;background:linear-gradient(135deg,#9be9b7,#4a9d75);display:grid;place-items:center;color:#10251b;font-size:26px;font-weight:900}
h1{font-size:22px;margin:0 0 6px}p{color:#a9bcb1;margin:0 0 18px;font-size:14px}
.bar{height:6px;background:#0d1b16;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#8de0ad;transition:width 1.2s ease}
input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #294238;background:#0d1b16;color:#f2f7f3;margin-bottom:10px;text-align:center;font-size:16px}
button{width:100%;border:0;border-radius:12px;padding:12px;background:#8de0ad;color:#10251b;font-weight:800;cursor:pointer}
.err{color:#ff9e9e;font-size:13px;min-height:20px;margin-top:10px}
.note{color:#a9bcb1;font-size:12px;margin-top:14px}
.hide{display:none}
</style>
</head>
<body>
<div class="c">
  <div class="logo">R</div>
  <h1 id="t">Validando acesso…</h1>
  <p id="s">Só um instante, estamos liberando o Recomeço.</p>
  <div id="load" class="bar"><i id="b"></i></div>

  <div id="codeForm" class="hide">
    <input id="code" type="password" placeholder="Código de acesso" autocomplete="off">
    <button id="goCode">Entrar</button>
  </div>

  <div id="cpfForm" class="hide">
    <input id="cpf" type="text" inputmode="numeric" placeholder="000.000.000-00" maxlength="14" autocomplete="off">
    <button id="goCpf">Cadastrar e entrar</button>
    <div class="note">Esse cadastro é feito uma única vez neste dispositivo.</div>
  </div>

  <div class="err" id="e"></div>
</div>
<script>
/* ===== CONFIGURAÇÃO ===== */
var SECRET="rc-troque-este-segredo-2026"; /* tem que ser IGUAL ao do recomeco.html */
var DESTINO="recomeco.html";
var ACCESS_CODE="";  /* vazio = validação automática. Ou coloque um código, ex.: "1234" */
/* ======================== */

function h(s){var a=0xdeadbeef,b=0x41c6ce57;for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677);}
  a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);
  b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);
  return(4294967296*(2097151&b)+(a>>>0)).toString(36);}
var $=function(i){return document.getElementById(i)};
function show(id,v){$(id).classList[v?"remove":"add"]("hide")}
function erro(m){$("e").textContent=m||""}

/* ---------- CPF ---------- */
function soDigitos(v){return (v||"").replace(/\D/g,"")}
function cpfValido(v){
  var c=soDigitos(v);
  if(c.length!==11||/^(\d)\1{10}$/.test(c))return false;
  for(var t=9;t<11;t++){
    var soma=0;
    for(var i=0;i<t;i++)soma+=parseInt(c[i],10)*(t+1-i);
    var d=((soma*10)%11)%10;
    if(d!==parseInt(c[t],10))return false;
  }
  return true;
}
function mascara(v){
  var c=soDigitos(v).slice(0,11);
  return c.replace(/^(\d{3})(\d)/,"$1.$2").replace(/^(\d{3})\.(\d{3})(\d)/,"$1.$2.$3").replace(/\.(\d{3})(\d)/,".$1-$2");
}

/* ---------- Dispositivo / cadastro ---------- */
function novoId(){
  try{if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();}catch(e){}
  return "d-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,10);
}
function cadastrado(){
  try{return !!(localStorage.getItem("rc_device_id")&&localStorage.getItem("rc_cpf_hash"));}catch(e){return false;}
}
function cadastrar(cpf){
  var c=soDigitos(cpf);
  localStorage.setItem("rc_device_id",novoId());
  localStorage.setItem("rc_cpf_hash",h("cpf|"+c+"|"+SECRET));
  localStorage.setItem("rc_cpf_mask","***."+c.slice(3,6)+"."+c.slice(6,9)+"-**");
  localStorage.setItem("rc_cadastro_em",new Date().toISOString());
}

/* ---------- Fluxo ---------- */
function liberar(){
  var ts=Date.now().toString(36);
  var token=ts+"."+h(ts+"|"+SECRET);
  location.replace(DESTINO+"?t="+encodeURIComponent(token));
}
function validando(){
  show("codeForm",false);show("cpfForm",false);show("load",true);
  $("t").textContent="Validando acesso…";
  $("s").textContent="Só um instante, estamos liberando o Recomeço.";
  erro("");
  $("b").style.width="100%";
  setTimeout(liberar,1300);
}
function etapaCadastro(){
  show("load",false);show("codeForm",false);show("cpfForm",true);
  $("t").textContent="Primeiro acesso";
  $("s").textContent="Informe seu CPF para cadastrar este dispositivo. Você só faz isso uma vez.";
  $("cpf").focus();
}
function aposCodigo(){
  try{localStorage.setItem("rc_teste","1");localStorage.removeItem("rc_teste");}
  catch(e){show("load",false);$("t").textContent="Armazenamento bloqueado";$("s").textContent="";erro("Seu navegador bloqueou o armazenamento local (modo privado?). Abra em uma aba normal.");return;}
  if(cadastrado())validando();else etapaCadastro();
}

$("cpf").addEventListener("input",function(){this.value=mascara(this.value)});
function tentarCpf(){
  var v=$("cpf").value;
  if(!cpfValido(v)){erro("CPF inválido. Confira os números e tente de novo.");return;}
  try{cadastrar(v);}catch(e){erro("Não foi possível salvar o cadastro neste dispositivo.");return;}
  erro("");validando();
}
$("goCpf").onclick=tentarCpf;
$("cpf").addEventListener("keydown",function(e){if(e.key==="Enter")tentarCpf()});

if(ACCESS_CODE){
  show("load",false);show("codeForm",true);
  $("t").textContent="Acesso restrito";
  $("s").textContent="Digite o código para entrar no Recomeço.";
  var inp=$("code");
  var tentarCodigo=function(){
    if(inp.value===ACCESS_CODE){erro("");aposCodigo();}
    else{erro("Código incorreto.");inp.value="";inp.focus();}
  };
  $("goCode").onclick=tentarCodigo;
  inp.addEventListener("keydown",function(e){if(e.key==="Enter")tentarCodigo()});
}else{
  setTimeout(aposCodigo,200);
}
</script>
</body>
</html>
